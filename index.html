<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>FREE DEPOSIT</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  min-height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  overflow:hidden;
  font-family:Arial,sans-serif;
  background:#03030b;
  color:#fff;
}

/* Neon background */
body::before{
  content:"";
  position:fixed;
  width:500px;
  height:500px;
  background:#7b00ff;
  filter:blur(180px);
  opacity:.35;
  top:-200px;
  left:-180px;
}

body::after{
  content:"";
  position:fixed;
  width:450px;
  height:450px;
  background:#00eaff;
  filter:blur(180px);
  opacity:.25;
  bottom:-200px;
  right:-150px;
}

/* Main card */
.card{
  position:relative;
  z-index:2;
  width:92%;
  max-width:420px;
  padding:32px 25px;
  border-radius:28px;
  background:rgba(10,10,25,.72);
  border:1px solid rgba(0,234,255,.35);
  box-shadow:
    0 0 25px rgba(0,234,255,.18),
    0 0 70px rgba(123,0,255,.15),
    inset 0 0 25px rgba(255,255,255,.025);
  backdrop-filter:blur(20px);
}

.logo{
  text-align:center;
  font-size:13px;
  letter-spacing:4px;
  color:#00eaff;
  margin-bottom:8px;
  text-shadow:0 0 15px #00eaff;
}

h1{
  text-align:center;
  font-size:31px;
  margin-bottom:30px;
  letter-spacing:1px;
  background:linear-gradient(90deg,#00eaff,#a600ff,#ff00c8);
  -webkit-background-clip:text;
  -webkit-text-fill-color:transparent;
  text-shadow:0 0 25px rgba(0,234,255,.2);
}

label{
  display:block;
  margin:18px 0 8px;
  font-size:13px;
  color:#bfc8ff;
  letter-spacing:.5px;
}

.inputBox{
  position:relative;
}

input{
  width:100%;
  height:54px;
  padding:0 17px;
  border-radius:14px;
  outline:none;
  border:1px solid rgba(255,255,255,.12);
  background:rgba(255,255,255,.055);
  color:white;
  font-size:16px;
  transition:.3s;
}

input:focus{
  border-color:#00eaff;
  box-shadow:
    0 0 10px rgba(0,234,255,.35),
    0 0 25px rgba(0,234,255,.12);
}

input::placeholder{
  color:#737895;
}

/* Button */
.depositBtn{
  width:100%;
  height:58px;
  margin-top:28px;
  border:0;
  border-radius:15px;
  cursor:pointer;
  color:#fff;
  font-size:16px;
  font-weight:800;
  letter-spacing:1px;
  background:linear-gradient(90deg,#00cfff,#7b00ff,#e500ff);
  box-shadow:
    0 0 15px rgba(0,234,255,.5),
    0 0 35px rgba(123,0,255,.35);
  transition:.25s;
}

.depositBtn:hover{
  transform:translateY(-2px);
  box-shadow:
    0 0 20px #00eaff,
    0 0 50px rgba(174,0,255,.6);
}

.depositBtn:active{
  transform:scale(.97);
}

/* Success screen */
#successPage{
  display:none;
  position:fixed;
  inset:0;
  z-index:20;
  align-items:center;
  justify-content:center;
  text-align:center;
  background:
    radial-gradient(circle at center,
    rgba(40,0,100,.75),
    #020208 70%);
}

.successBox{
  width:90%;
  max-width:430px;
  animation:successPop .65s cubic-bezier(.2,.8,.2,1);
}

.successIcon{
  width:105px;
  height:105px;
  margin:auto;
  border-radius:50%;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:58px;
  font-weight:bold;
  color:#fff;
  background:linear-gradient(135deg,#00ff88,#00bfff);
  box-shadow:
    0 0 20px #00ffb3,
    0 0 60px rgba(0,255,180,.55),
    0 0 120px rgba(0,200,255,.25);
}

.successBox h2{
  margin-top:27px;
  font-size:30px;
  letter-spacing:1px;
  color:#fff;
  text-shadow:
    0 0 10px #00ffb3,
    0 0 30px rgba(0,255,180,.5);
}

.successBox p{
  margin-top:12px;
  color:#aeb6ce;
  font-size:14px;
}

/* Firework particles */
.firework{
  position:fixed;
  width:5px;
  height:5px;
  border-radius:50%;
  pointer-events:none;
  z-index:50;
  background:#fff;
  box-shadow:
    0 0 8px #fff,
    0 0 18px currentColor;
  animation:firework 1.15s ease-out forwards;
}

@keyframes firework{
  0%{
    transform:translate(0,0) scale(1.4);
    opacity:1;
  }
  100%{
    transform:translate(var(--x),var(--y)) scale(0);
    opacity:0;
  }
}

@keyframes successPop{
  0%{
    transform:scale(.3);
    opacity:0;
  }
  70%{
    transform:scale(1.08);
  }
  100%{
    transform:scale(1);
    opacity:1;
  }
}

/* Flash */
.flash{
  position:fixed;
  inset:0;
  background:#fff;
  opacity:0;
  pointer-events:none;
  z-index:100;
  animation:flash .18s ease-out;
}

@keyframes flash{
  0%{opacity:.3}
  100%{opacity:0}
}
</style>
</head>

<body>

<!-- FREE DEPOSIT FORM -->
<div class="card" id="depositPage">

  <div class="logo">PREMIUM PANEL</div>

  <h1>FREE DEPOSIT</h1>

  <label>GAME UID</label>
  <div class="inputBox">
    <input
      id="uid"
      type="text"
      placeholder="Enter your Game UID"
      autocomplete="off">
  </div>

  <label>AMOUNT</label>
  <div class="inputBox">
    <input
      id="amount"
      type="number"
      placeholder="Enter amount"
      min="1">
  </div>

  <button class="depositBtn" onclick="makeDeposit()">
    ⚡ DEPOSIT NOW
  </button>

</div>


<!-- SUCCESS PAGE -->
<div id="successPage">

  <div class="successBox">

    <div class="successIcon">✓</div>

    <h2>DEPOSIT SUCCESSFUL</h2>

    <p>Your deposit has been successfully submitted.</p>

  </div>

</div>


<script>

/* Main function */
function makeDeposit(){

  const uid =
    document.getElementById("uid").value.trim();

  const amount =
    document.getElementById("amount").value.trim();

  if(!uid){
    alert("Please enter Game UID.");
    return;
  }

  if(!amount || Number(amount)<=0){
    alert("Please enter a valid amount.");
    return;
  }

  /*
    IMPORTANT:
    Audio is started directly from the button click.
    This avoids most browser autoplay restrictions.
  */
  playSuccessSound();

  // Hide form
  document.getElementById("depositPage").style.display="none";

  // Show success
  document.getElementById("successPage").style.display="flex";

  // Screen flash
  const flash=document.createElement("div");
  flash.className="flash";
  document.body.appendChild(flash);

  setTimeout(()=>flash.remove(),250);

  // Start fireworks
  launchFireworks();

}


/* =========================
   FIREWORKS
========================= */

function launchFireworks(){

  // Multiple bursts
  for(let burst=0; burst<12; burst++){

    setTimeout(()=>{

      const x =
        window.innerWidth * .12 +
        Math.random() *
        (window.innerWidth * .76);

      const y =
        window.innerHeight * .12 +
        Math.random() *
        (window.innerHeight * .48);

      createBurst(x,y);

    }, burst*300);

  }
}


function createBurst(cx,cy){

  const particleCount=45;

  for(let i=0;i<particleCount;i++){

    const particle=
      document.createElement("div");

    particle.className="firework";

    particle.style.left=cx+"px";
    particle.style.top=cy+"px";

    const angle=
      Math.random()*Math.PI*2;

    const distance=
      70+Math.random()*190;

    particle.style.setProperty(
      "--x",
      Math.cos(angle)*distance+"px"
    );

    particle.style.setProperty(
      "--y",
      Math.sin(angle)*distance+"px"
    );

    // Neon colours
    const colors=[
      "#00eaff",
      "#ff00c8",
      "#a600ff",
      "#00ff88",
      "#fff700",
      "#ffffff"
    ];

    const color=
      colors[Math.floor(Math.random()*colors.length)];

    particle.style.color=color;
    particle.style.background=color;

    document.body.appendChild(particle);

    setTimeout(()=>{
      particle.remove();
    },1300);

  }
}


/* =========================
   SUCCESS SOUND
========================= */

function playSuccessSound(){

  const AudioContext =
    window.AudioContext ||
    window.webkitAudioContext;

  if(!AudioContext) return;

  const audio =
    new AudioContext();

  /*
    Resume immediately after
    user's button click.
  */
  if(audio.state==="suspended"){
    audio.resume();
  }

  const now=audio.currentTime;

  // Success melody
  const notes=[
    {f:523.25,t:0},
    {f:659.25,t:.12},
    {f:783.99,t:.24},
    {f:1046.50,t:.38},
    {f:1318.51,t:.54}
  ];

  notes.forEach(note=>{

    const osc=
      audio.createOscillator();

    const gain=
      audio.createGain();

    osc.type="sine";
    osc.frequency.setValueAtTime(
      note.f,
      now+note.t
    );

    gain.gain.setValueAtTime(
      .001,
      now+note.t
    );

    gain.gain.exponentialRampToValueAtTime(
      .35,
      now+note.t+.025
    );

    gain.gain.exponentialRampToValueAtTime(
      .001,
      now+note.t+.45
    );

    osc.connect(gain);
    gain.connect(audio.destination);

    osc.start(now+note.t);
    osc.stop(now+note.t+.5);

  });

  // Final sparkle sound
  setTimeout(()=>{

    const osc=
      audio.createOscillator();

    const gain=
      audio.createGain();

    osc.type="triangle";
    osc.frequency.value=1800;

    gain.gain.setValueAtTime(
      .2,
      audio.currentTime
    );

    gain.gain.exponentialRampToValueAtTime(
      .001,
      audio.currentTime+.6
    );

    osc.connect(gain);
    gain.connect(audio.destination);

    osc.start();
    osc.stop(audio.currentTime+.6);

  },650);

}

</script>

</body>
</html>
